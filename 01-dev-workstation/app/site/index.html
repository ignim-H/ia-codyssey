<!DOCTYPE html>
<html lang="ko">
<head>

  <title>Codyssey Dev Workstation</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }

<body>
  <span class="tag">v1.0</span>

  <p id="message">MESSAGE: original</p>

</html>
